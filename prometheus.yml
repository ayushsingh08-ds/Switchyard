# Global configuration for Prometheus monitoring
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "switchyard-broker"
    static_configs:
      - targets: ["localhost:2112"]

  - job_name: "switchyard-worker"
    static_configs:
      - targets: ["localhost:8000"]
