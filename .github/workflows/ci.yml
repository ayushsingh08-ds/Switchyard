name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  filter:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      broker: ${{ steps.changes.outputs.broker }}
      python: ${{ steps.changes.outputs.python }}
      ui: ${{ steps.changes.outputs.ui }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Uses dorny/paths-filter to inspect modified files and conditionally trigger downstream jobs
      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            broker:
              - 'services/broker/**'
            python:
              - 'services/worker/**'
              - 'services/mcp-servers/**'
            ui:
              - 'ui/**'

  broker:
    name: Broker (Go)
    needs: filter
    if: ${{ needs.filter.outputs.broker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go Tests with Race Detector
        working-directory: services/broker
        run: go test -race ./...

  python:
    name: Worker & MCP (Python)
    needs: filter
    if: ${{ needs.filter.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Lint with Ruff
        run: ruff check services/worker services/mcp-servers

      - name: Test with Pytest
        run: pytest services/worker services/mcp-servers

  ui:
    name: UI (Node)
    needs: filter
    if: ${{ needs.filter.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build UI
        working-directory: ui
        run: npm run build
